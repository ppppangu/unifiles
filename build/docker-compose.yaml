version: '3.8'
services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/wyyy/rag_postgres:0.1.0
    container_name: postgresql-multi-extension
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # 密码
      POSTGRES_DB: postgres            # 默认数据库
    ports:
      - "5437:5432"                 # 端口号, 启动多个实例时需要改
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./custom-config/postgresql.conf:/etc/postgresql/postgresql.conf  # 挂载配置文件
      - ./sql-scripts:/docker-entrypoint-initdb.d/  # 初始化脚本
    restart: always
    networks:
      - outside
networks:
  outside:
    external: trues