[tool.uv.workspace]
members = [
    "apps/server",
    "packages/generated/server-protocol-python",
    "packages/generated/sdk-python",
    "packages/python",
]

[tool.uv.sources]
unifiles-server-protocol = { workspace = true }
unifiles-generated = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "openapi-spec-validator>=0.7.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pyyaml>=6.0.2",
    "respx>=0.22.0",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260815",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.23",
    "mkdocs-monorepo-plugin>=1.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "apps/server/tests",
    "codegen/tests",
    "packages/python/tests",
]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the local API and its backing services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["**/_generated/**", "**/generated/**"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["unifiles_generated.*", "unifiles_server_protocol.*"]
ignore_errors = true
