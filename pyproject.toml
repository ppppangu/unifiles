[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifiles"
version = "1.0.0"
description = "Unifiles document processing platform - SaaS service, client library, and self-deployment package"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Unifiles Team", email = "support@unifiles.com"},
]
maintainers = [
    {name = "Unifiles Team", email = "support@unifiles.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "document-processing", "ocr", "pdf", "knowledge-base", 
    "vector-database", "text-extraction", "api-client", "unifiles"
]
dependencies = [
    "requests>=2.28.0",
    "pathlib2>=2.3.0; python_version<'3.6'",
    "pydantic-settings>=2.8.1",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=46.0.3",
    "pyjwt>=2.9.0",
    "loguru>=0.7.3",
    "asyncpg>=0.30.0",
    "redis>=6.1.1",
    "fastapi>=0.119.1",
    "uvicorn>=0.33.0",
    "minio>=7.2.7",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pillow>=10.4.0",
    "aiofiles>=24.1.0",
    "pdfplumber>=0.11.5",
    "pymupdf>=1.24.11",
    "pypdf>=5.9.0",
    "opentelemetry-api>=1.33.1",
    "opentelemetry-sdk>=1.33.1",
    "opentelemetry-instrumentation-fastapi>=0.54b1",
    "bcrypt<5.0.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
    "responses>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/unifiles/unifiles-client"
Documentation = "https://unifiles-client.readthedocs.io/"
Repository = "https://github.com/unifiles/unifiles-client.git"
Issues = "https://github.com/unifiles/unifiles-client/issues"
Changelog = "https://github.com/unifiles/unifiles-client/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["unifiles"]

[tool.setuptools.package-dir]
unifiles = "unifiles"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["unifiles"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["unifiles"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
# Target Python 3.8+ for compatibility
target-version = "py38"
line-length = 88
indent-width = 4

# Include all Python files in the project
include = ["*.py", "*.pyi", "**/pyproject.toml"]

# Exclude common directories that shouldn't be linted
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.egg-info",
]

[tool.ruff.lint]
# Balanced rule set - focus on real issues, not style preferences
select = [
    "E",      # pycodestyle errors (syntax and obvious issues)
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (undefined names, unused imports)
    "B",      # flake8-bugbear (common bugs)
    "I",      # isort (import ordering)
    "C4",     # flake8-comprehensions (better list/dict comprehensions)
    "UP",     # pyupgrade (modern Python syntax)
]

# Relaxed ignore list - focus on developer productivity
ignore = [
    "E501",    # Line too long (handled by formatter)
    "E402",    # Module level import not at top (sometimes needed)
    "B008",    # Function call in argument defaults (common in FastAPI)
]

# Allow unfixable rules to be fixed
unfixable = []

# Allow unused variables when prefixed with underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# No per-file ignores needed with relaxed rules

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Use 4 spaces for indentation
indent-style = "space"

# Respect magic trailing comma
skip-magic-trailing-comma = false

# Automatically detect line ending
line-ending = "auto"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material>=9.6.23",
]

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["unifiles"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
