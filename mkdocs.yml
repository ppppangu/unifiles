site_name: Unifiles Documentation
site_url: https://unifiles.dev
site_description: Unifiles - LLM 应用层的文档处理基础设施
repo_url: https://github.com/ppppangu/Unifiles
repo_name: ppppangu/Unifiles
site_dir: site
docs_dir: docs/online

theme:
  name: material
  language: zh
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.footnote.tooltips
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 了解 Unifiles: '!include ./docs/online/what-is-unifiles/mkdocs.yml'
  - 使用 API: '!include ./docs/online/using-the-api/mkdocs.yml'
  - Cookbook: '!include ./docs/online/cookbook/mkdocs.yml'
  - API 参考: '!include ./docs/online/api-reference/mkdocs.yml'
  - 集成: '!include ./docs/online/integrations/mkdocs.yml'
  - 技术深潜: '!include ./docs/online/under-the-hood/mkdocs.yml'
  - 自部署: '!include ./docs/online/self-hosting/mkdocs.yml'

plugins:
  - monorepo
  - search:
      lang:
        - zh
        - en

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ppppangu/Unifiles
      name: Unifiles on GitHub
