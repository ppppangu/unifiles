[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "unifiles-client"
version = "0.1.0"
authors = [{name = "meidici911", email = "meidici911@gmail.com"}]
description = "Official Python SDK for the Unifiles API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "python-dateutil>=2.9.0",
    "typing-extensions>=4.12.0",
    "unifiles-generated==0.1.0",
]

[project.urls]
Documentation = "https://unifiles.dev"
Repository = "https://github.com/ppppangu/unifiles"

[tool.hatch.build.targets.wheel]
packages = ["src/unifiles"]

[tool.hatch.build.targets.wheel.force-include]
LICENSE = "LICENSE"
NOTICE = "NOTICE"
