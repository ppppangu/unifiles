[metadata]
name = unifiles_server_protocol
version = 0.1.0
description = Canonical contract for the self-hosted Unifiles document processing API. Server bindings and official SDK cores are generated from this document.
long_description = file: README.md
keywords = OpenAPI Unifiles API
python_requires = >= 3.10.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
