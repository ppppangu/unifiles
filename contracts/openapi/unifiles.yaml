components:
  schemas:
    APIKeyCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        scopes:
          items:
            type: string
            pattern: ^(\*|(files|extractions|kb|webhooks|api_keys|usage):(read|write|\*))$
          type: array
          title: Scopes
        expires_at:
          type: string
          format: date-time
          title: Expires At
          nullable: true
      additionalProperties: false
      type: object
      required:
      - name
      title: APIKeyCreate
    APIKeyResource:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        key:
          type: string
          title: Key
          nullable: true
        key_prefix:
          type: string
          title: Key Prefix
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        last_used_at:
          type: string
          format: date-time
          title: Last Used At
          nullable: true
        expires_at:
          type: string
          format: date-time
          title: Expires At
          nullable: true
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - key_prefix
      - scopes
      - created_at
      title: APIKeyResource
    ChunkResource:
      properties:
        id:
          type: string
          title: Id
        document_id:
          type: string
          title: Document Id
        document_title:
          type: string
          title: Document Title
          nullable: true
        content:
          type: string
          title: Content
        score:
          type: number
          title: Score
        vector_score:
          type: number
          title: Vector Score
          nullable: true
        keyword_score:
          type: number
          title: Keyword Score
          nullable: true
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - id
      - document_id
      - content
      - score
      title: ChunkResource
    DeletionResult:
      properties:
        id:
          type: string
          title: Id
        deleted:
          type: boolean
          title: Deleted
          default: true
      additionalProperties: false
      type: object
      required:
      - id
      title: DeletionResult
    DocumentCreate:
      properties:
        file_id:
          type: string
          title: File Id
        title:
          type: string
          title: Title
