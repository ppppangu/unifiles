          type: string
          title: File Id
        title:
          type: string
          title: Title
          nullable: true
        status:
          type: string
          enum:
          - pending
          - indexing
          - indexed
          - failed
          - cancelled
          title: Status
        chunk_count:
          type: integer
          title: Chunk Count
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          nullable: true
