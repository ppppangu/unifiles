name: Deploy to Production

on:
  push:
    branches: [ main, master, nbfile ]  # Trigger on push to main or master branch
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Install dependencies
      run: |
        uv sync --dev
        
    - name: Run linter
      run: |
        uv run ruff check .
        
    - name: Run type checker
      run: |
        uv run mypy unifiles/ --config-file=mypy.ini
        
    - name: Run tests
      run: |
        uv run pytest tests/ -v
        
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          cd ${{ secrets.PROJECT_PATH || '/var/www/unifiles' }}
          
          # Pull latest changes
          git pull origin main
          
          # Update dependencies
          uv sync
          
          # Run database migrations if any
          if [ -f "scripts/migrate.py" ]; then
            uv run python scripts/migrate.py
          fi
          
          # Restart the application
          sudo systemctl restart unifiles
          
          # Check if service is running
          sudo systemctl status unifiles
          
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi