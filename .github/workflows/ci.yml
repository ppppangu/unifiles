name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: npm ci
      - run: uv sync --all-packages --group dev
      - run: uv run python scripts/check_openapi.py
      - run: uv run python scripts/export_operation_ownership.py --check
      - run: uv run python scripts/generate_contract.py
      - name: Check generated drift, including untracked files
        run: |
          generated_status="$(git status --porcelain -- \
            apps/server/generated \
            packages/python/generated \
            packages/typescript/generated)"
          if [[ -n "$generated_status" ]]; then
            echo "$generated_status"
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check apps packages/python scripts
      - run: uv run mypy apps/server/src packages/python/src scripts
      - run: uv run pytest
      - run: uv run python scripts/check_openapi.py
      - run: uv build --package unifiles-client
      - run: uv build --package unifiles-server

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --workspace @wyy/unifiles --dry-run
      - run: npm pack --workspace @wyy/unifiles-cli --dry-run
