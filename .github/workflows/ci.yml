name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: npm ci
      - run: uv sync --all-packages --group dev
      - run: uv run python codegen/scripts/codegen.py validate
      - run: uv run python codegen/scripts/export_operation_ownership.py --check
      - run: uv run python codegen/scripts/check_public_surface.py
      - run: uv run python codegen/scripts/codegen.py check all

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check apps packages/python scripts codegen
      - run: uv run mypy apps/server/src packages/python/src scripts codegen/scripts
      - run: uv run pytest
      - run: uv run python codegen/scripts/validate_contract.py
      - run: uv build --package unifiles-server-protocol
      - name: Import protocol wheel without server application
        run: |
          shopt -s nullglob
          protocol_wheels=(./dist/unifiles_server_protocol-*.whl)
          test "${#protocol_wheels[@]}" -eq 1
          uv run --no-project \
            --with "${protocol_wheels[0]}" \
            python -c "import importlib, pkgutil; from unifiles_server_protocol import apis; [importlib.import_module(name) for _, name, _ in pkgutil.iter_modules(apis.__path__, apis.__name__ + '.')]"
      - run: uv build --package unifiles-generated
      - run: uv build --package unifiles-client
      - run: uv build --package unifiles-server
      - run: uv run python codegen/scripts/check_python_artifacts.py
      - name: Import generated and public Python SDK wheels together
        run: |
          shopt -s nullglob
          generated_wheels=(./dist/unifiles_generated-*.whl)
          client_wheels=(./dist/unifiles_client-*.whl)
          test "${#generated_wheels[@]}" -eq 1
          test "${#client_wheels[@]}" -eq 1
          uv run --no-project \
            --with "${generated_wheels[0]}" \
            --with "${client_wheels[0]}" \
            python -c "from unifiles import UnifilesClient; from unifiles_generated import FilesApi; assert UnifilesClient and FilesApi"

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --workspace @wyy/unifiles-generated --dry-run
      - run: npm pack --workspace @wyy/unifiles --dry-run
      - run: npm pack --workspace @wyy/unifiles-cli --dry-run
      - name: Install and smoke test packed npm artifacts
        run: |
          mkdir -p dist/npm
          npm pack --workspace @wyy/unifiles-generated --pack-destination dist/npm
          npm pack --workspace @wyy/unifiles --pack-destination dist/npm
          npm pack --workspace @wyy/unifiles-cli --pack-destination dist/npm
          shopt -s nullglob
          generated_packages=("$PWD"/dist/npm/wyy-unifiles-generated-*.tgz)
          public_packages=("$PWD"/dist/npm/wyy-unifiles-[0-9]*.tgz)
          cli_packages=("$PWD"/dist/npm/wyy-unifiles-cli-*.tgz)
          test "${#generated_packages[@]}" -eq 1
          test "${#public_packages[@]}" -eq 1
          test "${#cli_packages[@]}" -eq 1
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          npm install --prefix "$smoke_dir" \
            "${generated_packages[0]}" \
            "${public_packages[0]}" \
            "${cli_packages[0]}"
          "$smoke_dir/node_modules/.bin/unifiles" --help | grep \
            "Unix-style client for the Unifiles API"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/server/Dockerfile --tag unifiles-server:test .
      - name: Smoke test server image
        run: |
          docker run --detach --name unifiles-server-test \
            --env UNIFILES_BOOTSTRAP_API_KEY=sk_ci_local \
            --publish 8088:8088 \
            unifiles-server:test
          trap 'docker rm --force unifiles-server-test' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8088/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs unifiles-server-test
          exit 1
