name: Docker Deploy

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging
    
    steps:
    - name: Deploy to Staging
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: ${{ secrets.STAGING_PORT || 22 }}
        script: |
          # Login to GitHub Container Registry
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Pull new image
          docker pull ${{ needs.build-and-push.outputs.image-tag }}
          
          # Stop and remove old container
          docker stop unifiles-staging 2>/dev/null || true
          docker rm unifiles-staging 2>/dev/null || true
          
          # Run new container
          docker run -d \
            --name unifiles-staging \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file .env.staging \
            -v /var/log/unifiles:/app/logs \
            ${{ needs.build-and-push.outputs.image-tag }}
            
          # Wait for container to start
          sleep 10
          
          # Health check
          curl -f http://localhost:8000/health || exit 1
          
          echo "✅ Staging deployment successful!"
          
  deploy-production:
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        port: ${{ secrets.PROD_PORT || 22 }}
        script: |
          # Login to GitHub Container Registry
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Pull new image
          docker pull ${{ needs.build-and-push.outputs.image-tag }}
          
          # Rolling update with zero downtime
          # Start new container on different port
          docker run -d \
            --name unifiles-new \
            --restart unless-stopped \
            -p 8001:8000 \
            --env-file .env.production \
            -v /var/log/unifiles:/app/logs \
            ${{ needs.build-and-push.outputs.image-tag }}
            
          # Wait for new container to be ready
          sleep 30
          curl -f http://localhost:8001/health || exit 1
          
          # Update nginx to point to new container
          sudo sed -i 's/8000/8001/g' /etc/nginx/sites-available/unifiles
          sudo nginx -t && sudo systemctl reload nginx
          
          # Stop old container
          docker stop unifiles-production 2>/dev/null || true
          docker rm unifiles-production 2>/dev/null || true
          
          # Rename new container
          docker rename unifiles-new unifiles-production
          
          # Update nginx back to standard port
          sudo sed -i 's/8001/8000/g' /etc/nginx/sites-available/unifiles
          docker stop unifiles-production
          docker run -d \
            --name unifiles-production-final \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file .env.production \
            -v /var/log/unifiles:/app/logs \
            ${{ needs.build-and-push.outputs.image-tag }}
            
          docker rm unifiles-production
          docker rename unifiles-production-final unifiles-production
          
          sudo nginx -t && sudo systemctl reload nginx
          
          echo "✅ Production deployment successful!"
          
  notify:
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
          echo "✅ Staging deployment successful!"
        else
          echo "❌ Staging deployment failed!"
        fi
        
        if [ "${{ needs.deploy-production.result }}" == "success" ]; then
          echo "✅ Production deployment successful!"
        elif [ "${{ needs.deploy-production.result }}" == "skipped" ]; then
          echo "⏭️ Production deployment skipped (not a tag)"
        else
          echo "❌ Production deployment failed!"
        fi