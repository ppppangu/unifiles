name: Release packages

on:
  push:
    tags:
      - "python-v*"
      - "server-v*"
      - "typescript-v*"
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  python-sdk:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --frozen python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"
      - run: uv build --package unifiles-generated --out-dir dist/generated
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/generated/
      - run: uv build --package unifiles-client --out-dir dist/public
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/public/

  server:
    if: startsWith(github.ref_name, 'server-v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --frozen python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"
      - run: uv build --package unifiles-server-protocol --out-dir dist/protocol
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/protocol/
      - run: uv build --package unifiles-server --out-dir dist/server
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/server/

  npm:
    if: startsWith(github.ref_name, 'typescript-v') || startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run check
      - run: uv run --frozen python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"
      - if: startsWith(github.ref_name, 'typescript-v')
        run: npm publish --workspace @wyy/unifiles-generated --provenance --access public
      - if: startsWith(github.ref_name, 'typescript-v')
        run: npm publish --workspace @wyy/unifiles --provenance --access public
      - if: startsWith(github.ref_name, 'cli-v')
        run: npm publish --workspace @wyy/unifiles-cli --provenance --access public
