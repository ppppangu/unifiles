[mypy]
# 基本配置
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

# 允许隐式可选参数（临时配置）
no_implicit_optional = False

# 忽略特定错误类型
disable_error_code = assignment,attr-defined,call-arg,arg-type,return-value,var-annotated,operator,no-any-return,no-untyped-def

# 忽略旧代码目录（legacy 代码不检查类型）
[mypy-unifiles.app.legacy.*]
ignore_errors = True

[mypy-unifiles.core.database.manager]
ignore_errors = True

[mypy-unifiles.core.services.*]
ignore_errors = True

# OCR 模块暂时忽略
[mypy-unifiles.core.ocr.*]
ignore_errors = True

# 只检查新的 v1 API 代码
[mypy-unifiles.app.v1.*]
disallow_untyped_defs = True
warn_return_any = True